[tools]
zig = "0.16.0"

[tasks.fmt]
description = "Format Zig sources"
run = [
  "zig fmt build.zig src tests",
  "zig fmt --zon build.zig.zon",
]

[tasks.fmt-check]
description = "Check Zig formatting"
run = [
  "zig fmt --check --ast-check build.zig src tests",
  "zig fmt --check --zon build.zig.zon",
]

[tasks.lint]
description = "Run static checks"
depends = ["fmt-check"]

[tasks.test]
description = "Run test suite"
run = "zig build test"

[tasks.suite]
description = "Run the official JSON Schema conformance suite (required tests)"
run = "zig build suite"

[tasks.suite-all]
description = "Run the conformance suite including optional and format groups"
run = "zig build suite -- --format"

[tasks.run]
description = "Run example binary"
run = "zig build run"

[tasks.check]
description = "Run formatting checks and tests"
depends = ["lint", "test"]
